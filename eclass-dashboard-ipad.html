<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eClass Dashboard</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#2b2b2b;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.mascot{position:fixed;z-index:1;pointer-events:none}
.mascot img{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.14))}
#m-dog{top:8px;left:6px;width:92px}
#m-cat{top:8px;right:6px;width:92px}
#m-rabbit{bottom:10px;left:6px;width:88px}
#m-lion{bottom:10px;right:6px;width:96px}
#m-horse{top:42%;left:2px;width:76px}
#m-owl{top:42%;right:2px;width:76px}
#hdr{position:relative;z-index:2;flex:0 0 auto;text-align:center;padding:12px 16px 8px}
#clock{display:inline-block;background:rgba(255,255,255,.95);border-radius:999px;padding:9px 30px;font-size:1.3em;font-weight:800;letter-spacing:.02em;box-shadow:0 3px 12px rgba(0,0,0,.14);white-space:nowrap}
#cols{position:relative;z-index:2;flex:1 1 auto;min-height:0;display:flex;gap:16px;padding:2px 10px 14px}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;min-height:0}
.col-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;padding:4px 6px 8px}
.col-title{font-size:1.32em;font-weight:800;color:#343a40;text-shadow:0 1px 0 rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-sync{font-size:.92em;color:#5c636a;font-weight:600;white-space:nowrap;margin-left:10px}
.col-note{flex:0 0 auto;background:#fff3bf;border:1px solid #ffd43b;border-radius:10px;padding:8px 12px;margin:0 0 8px;font-size:.9em}
.panel{background:rgba(255,255,255,.97);border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.12);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.panel.notices{flex:1 1 50%;margin-bottom:14px}
.bsplit{flex:1 1 50%;display:flex;gap:14px;min-height:0}
.bsplit .panel{flex:1 1 0}
.phead{flex:0 0 auto;font-size:1.32em;font-weight:800;color:#fff;padding:10px 18px;letter-spacing:.02em}
.phead.notices{background:#e6492d}
.phead.cal{background:#1c7ed6}
.phead.hw{background:#2f9e44}
.nscroll{flex:1 1 auto;overflow-y:auto;padding:6px 16px 14px;min-height:0}
.nsec-head{display:flex;justify-content:space-between;align-items:center;font-size:1.14em;font-weight:800;color:#d9480f;padding:10px 4px 6px;cursor:pointer}
.nsec[data-sec="pending"] .nsec-head{color:#e67700}
.nsec[data-sec="signed"] .nsec-head{color:#2f9e44}
.nsec-body.collapsed{display:none}
.chev{font-size:1.1em}
.nrow{margin:0 0 8px 20px;padding:10px 14px;background:#f8f9fa;border-left:5px solid #ffa94d;border-radius:10px}
.nrow[data-url]{cursor:pointer}
.nrow[data-url]:active{background:#e9ecef}
.nsec[data-sec="new"] .nrow{border-left-color:#ff6b6b}
.nsec[data-sec="pending"] .nrow{border-left-color:#ffa94d}
.nsec[data-sec="signed"] .nrow{border-left-color:#51cf66;background:#eef7ee}
.nrow-title{font-size:1.02em;font-weight:700;line-height:1.35}
.nrow-deadline{font-size:.92em;color:#c92a2a;font-weight:700;margin-top:3px}
.nrow-signedat{font-size:.92em;color:#495057;margin-top:3px}
.nrow-tap-hint{font-size:.82em;color:#868e96;margin-top:4px}
.nempty,.hw-empty{color:#868e96;font-style:italic;padding:12px 4px}
.calnav{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:6px 10px 2px}
.calnav button{border:none;background:#e7f1fb;color:#1c7ed6;font-size:1.4em;font-weight:800;width:38px;height:38px;border-radius:50%;cursor:pointer;line-height:1}
.cal-title{font-weight:800;font-size:1.05em}
.calgrid{flex:0 0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:6px 12px;min-height:120px}
.dow{text-align:center;font-size:.72em;font-weight:800;color:#868e96;padding:2px 0}
.day{position:relative;text-align:center;font-size:.85em;padding:5px 0;border-radius:8px;background:#f1f3f5;min-height:28px}
.day.blank{background:transparent}
.day.has-ev{background:#d0ebff;font-weight:700;cursor:pointer}
.day.istoday{outline:3px solid #1c7ed6;outline-offset:-3px;font-weight:800}
.day .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#1c7ed6}
.cal-lines{flex:1 1 auto;overflow-y:auto;padding:4px 14px 10px;min-height:0}
.cl{font-size:.9em;padding:5px 0;border-top:1px dashed #dee2e6;line-height:1.35}
.hw-body{flex:1 1 auto;overflow-y:auto;padding:10px 14px 12px;min-height:0;text-align:center;display:flex;flex-direction:column;align-items:center}
.hw-body img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hw-cap{font-size:.9em;color:#495057;font-weight:600;margin-top:8px}
.hw-item{text-align:left;align-self:stretch;padding:8px 10px;background:#f8f9fa;border-radius:8px;margin-bottom:8px}
#mback{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px}
#mback[hidden]{display:none}
#modal{background:#fff;border-radius:18px;width:min(920px,96vw);height:93vh;height:93dvh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.35)}
.modal-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;background:#f1f3f5}
#modal-title{font-weight:800;font-size:1.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modal-close{flex:0 0 auto;border:none;background:#e6492d;color:#fff;font-weight:800;font-size:1em;padding:10px 20px;border-radius:999px;cursor:pointer}
#modal-body{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:#212529;overflow:auto}
#modal-body img{max-width:100%;max-height:100%;object-fit:contain}
#modal-body iframe{width:100%;height:100%;border:none;background:#fff}
.modal-foot{flex:0 0 auto;text-align:center;padding:10px;background:#f1f3f5}
#modal-newtab{color:#1c7ed6;font-weight:700}
.mfallback{color:#fff;padding:24px;text-align:center;line-height:1.6}
.dayev{color:#fff;padding:24px;align-self:flex-start;width:100%}
.dayev h3{margin-top:0}
.de{background:rgba(255,255,255,.12);border-radius:10px;padding:10px 14px;margin-bottom:10px}
@media (max-width:900px){body{overflow:auto;height:auto;min-height:100vh}#cols{flex-direction:column;padding:2px 16px 14px}.col{min-height:82vh}.mascot{width:64px!important}#hdr{padding:12px 16px 8px}}
</style>
</head>

<script>
/* =====================================================================
   CONFIG — edit these three lines to suit your setup
   ===================================================================== */
const GOOGLE_API_KEY = 'AIzaSyDz5lzuq-tu7PjUmvLNYsiVqH-6uP35HoI';
const FILE_A_ID = '1rdTpx0PufqjMKwVbv90zsjqiDdvWhiUR';
const FILE_B_ID = ''; // second file ID when available
const FILE_A_URL = './eclass-file-a.json';
const FILE_B_URL = './eclass-file-b.json'; // second child's file — paste its public URL here when available
const REFRESH_MINUTES = 15; // re-fetch both files this often

/* ============================== helpers ============================== */
const $ = (sel, el) => (el || document).querySelector(sel);
const WD_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MO_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function ymd(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function todayStr() { return ymd(new Date()); }
function sevenDaysAgoStr() {
  const d = new Date(); d.setDate(d.getDate() - 7);
  return ymd(d);
}
function fmtShort(d) { return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MO[d.getMonth()]; }
function fmtDateLong(ds) { // "2026-10-16" -> "Fri 16 Oct 2026"
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ds || '');
  if (!m) return ds || '';
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return WD[d.getDay()] + ' ' + (+m[3]) + ' ' + MO[d.getMonth()] + ' ' + m[1];
}
function agoText(iso) {
  if (!iso) return 'Not synced yet';
  const t = new Date(iso).getTime();
  if (isNaN(t)) return 'Not synced yet';
  const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if (s < 90) return 'Synced just now';
  const m = Math.floor(s / 60);
  if (m < 60) return 'Synced ' + m + ' min ago';
  const h = Math.floor(m / 60);
  if (h < 24) return 'Synced ' + h + ' h ago';
  return 'Synced ' + Math.floor(h / 24) + ' d ago';
}
function isImageUrl(u) {
  return /\.(jpe?g|png|gif|webp|bmp)(\?|#|$)/i.test(u) || /thumbnail|lh3\.googleusercontent/i.test(u);
}

/* ============================== state ============================== */
const state = {
  A: { data: null, error: null, configured: !!FILE_A_URL },
  B: { data: null, error: null, configured: !!FILE_B_URL }
};
const secOpen = { A: { new: true, pending: true, signed: true }, B: { new: true, pending: true, signed: true } };
const calView = { A: null, B: null }; // {y, m} per column; null = current month

/* ============================== fetch ============================== */
async function fetchColumn(key, url) {
  const st = state[key];
  if (!url) { st.configured = false; renderColumn(key); return; }
  st.configured = true;
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data || typeof data !== 'object' || !Array.isArray(data.notices)) throw new Error('unexpected file format');
    st.data = data;
    st.error = null;
  } catch (e) {
    st.error = (e && e.message) ? e.message : String(e);
    // keep last-good data untouched
  }
  renderColumn(key);
}
async function refreshAll() {
  try {
    await Promise.all([fetchColumn('A', FILE_A_URL), fetchColumn('B', FILE_B_URL)]);
  } catch (e) { /* per-column isolation already handled */ }
}

/* ============================== notices ============================== */
function signedWithin7(n) {
  const ref = n.signedAt || n.date || '';
  const ds = String(ref).slice(0, 10);
  return ds >= sevenDaysAgoStr();
}
function noticeRow(n, sec) {
  const tappable = n.attachmentUrl ? ' data-url="' + esc(n.attachmentUrl) + '" data-title="' + esc(n.title || '') + '"' : '';
  if (sec === 'signed') {
    return '<div class="nrow sec-signed"' + tappable + '>' +
      '<div class="nrow-title">' + esc(n.id ? n.id + ': ' : '') + esc(n.title || '') + '</div>' +
      '<div class="nrow-signedat">Signed on ' + esc(n.signedAt || n.date || '') + '</div>' +
      '</div>';
  }
  return '<div class="nrow sec-' + sec + '"' + tappable + '>' +
    '<div class="nrow-title">' + esc(n.title || '') + '</div>' +
    (n.deadline ? '<div class="nrow-deadline">Deadline: ' + esc(n.deadline) + '</div>' : '') +
    '</div>';
}
function renderNotices(key, data) {
  const col = $('#col-' + key);
  const box = $('.nscroll', col);
  const notices = Array.isArray(data.notices) ? data.notices : [];
  const groups = {
    new: notices.filter(n => n.status === 'new'),
    pending: notices.filter(n => n.status === 'pending'),
    signed: notices.filter(n => n.status === 'signed' && signedWithin7(n))
  };
  const titles = { new: 'New eNotices', pending: 'Pending signature', signed: 'Signed' };
  let html = '';
  ['new', 'pending', 'signed'].forEach(sec => {
    const list = groups[sec];
    const open = secOpen[key][sec];
    html += '<div class="nsec" data-sec="' + sec + '">';
    if (list.length) {
      html += '<div class="nsec-head" data-sechead="' + sec + '"><span>' + titles[sec] + ' (' + list.length + ')</span><span class="chev">' + (open ? '▾' : '▸') + '</span></div>';
      html += '<div class="nsec-body' + (open ? '' : ' collapsed') + '">';
      list.forEach(n => { html += noticeRow(n, sec); });
      html += '</div>';
    } else {
      html += '<div class="nsec-head" style="cursor:default"><span>' + titles[sec] + ' (0)</span></div>';
      if (sec === 'signed') html += '<div class="nempty">No recently signed notices</div>';
    }
    html += '</div>';
  });
  box.innerHTML = html;
}

/* ============================== calendar ============================== */
function eventsByDate(data) {
  const map = {};
  (Array.isArray(data.calendar) ? data.calendar : []).forEach(e => {
    if (!e || !e.date) return;
    (map[e.date] = map[e.date] || []).push(e);
  });
  return map;
}
function renderCal(key, data) {
  const col = $('#col-' + key);
  const now = new Date();
  if (!calView[key]) calView[key] = { y: now.getFullYear(), m: now.getMonth() };
  const v = calView[key];
  $('.cal-title', col).textContent = MO_LONG[v.m] + ' ' + v.y;

  const evMap = eventsByDate(data);
  const first = new Date(v.y, v.m, 1);
  const days = new Date(v.y, v.m + 1, 0).getDate();
  const tStr = todayStr();
  let html = '';
  WD.forEach(d => { html += '<div class="dow">' + d + '</div>'; });
  for (let i = 0; i < first.getDay(); i++) html += '<div class="day blank"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = v.y + '-' + String(v.m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const evs = evMap[ds] || [];
    const cls = 'day' + (evs.length ? ' has-ev' : '') + (ds === tStr ? ' istoday' : '');
    html += '<div class="' + cls + '" data-day="' + ds + '">' + d + (evs.length ? '<span class="dot"></span>' : '') + '</div>';
  }
  const grid = $('.calgrid', col);
  grid.innerHTML = html;
  grid._evMap = evMap;

  // four lines: today + next 3 days
  let lines = '';
  for (let i = 0; i < 4; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    const ds = ymd(d);
    const evs = evMap[ds] || [];
    const label = i === 0 ? 'Today (' + fmtShort(d) + ')' : fmtShort(d);
    const txt = evs.length ? evs.map(e => e.title).join('; ') : 'No events';
    lines += '<div class="cl"><b>' + esc(label) + ':</b> ' + esc(txt) + '</div>';
  }
  $('.cal-lines', col).innerHTML = lines;
}
function showDayEvents(key, ds, evMap) {
  const evs = evMap[ds] || [];
  const d = new Date(+ds.slice(0, 4), +ds.slice(5, 7) - 1, +ds.slice(8, 10));
  openModal(fmtDateLong(ds), null);
  const body = $('#modal-body');
  let html = '<div class="dayev"><h3>' + esc(fmtDateLong(ds)) + '</h3>';
  if (!evs.length) {
    html += '<div class="hw-empty">No events on this day.</div>';
  } else {
    evs.forEach(e => {
      html += '<div class="de"><b>' + esc(e.title || '') + '</b>' +
        (e.detail ? '<div style="color:#495057;font-size:.92em;margin-top:4px">' + esc(e.detail) + '</div>' : '') + '</div>';
    });
  }
  body.innerHTML = html + '</div>';
  $('#modal-newtab').style.display = 'none';
}

/* ============================== homework ============================== */
function renderHomework(key, data) {
  const body = $('#hw-body-' + key) || $('.hw-body', $('#col-' + key));
  const col = $('#col-' + key);
  const box = $('.hw-body', col);
  if (data.homeworkImageUrl) {
    const cap = data.homeworkImageDate ? 'Homework list — ' + fmtDateLong(data.homeworkImageDate) : 'Homework list';
    box.innerHTML = '<img id="hwimg-' + key + '" src="' + esc(data.homeworkImageUrl) + '" alt="Homework list" style="cursor:pointer">' +
      '<div class="hw-cap">' + esc(cap) + '</div>';
    const hwimg = document.getElementById('hwimg-' + key);
    if (hwimg) {
      hwimg.addEventListener('click', function() { openModal('Homework list', data.homeworkImageUrl); });
    }
    const img = $('#hwimg-' + key);
    img.onerror = () => renderHomeworkText(box, data);
  } else {
    renderHomeworkText(box, data);
  }
}
function renderHomeworkText(box, data) {
  const list = Array.isArray(data.homeworkToday) ? data.homeworkToday : [];
  if (!list.length) {
    box.innerHTML = '<div class="hw-empty">No homework recorded</div>';
    return;
  }
  box.innerHTML = list.map(h =>
    '<div class="hw-item"><b>' + esc(h.subject || '') + ':</b> ' + esc(h.title || '') +
    (h.detail ? '<div style="color:#495057;font-size:.9em">' + esc(h.detail) + '</div>' : '') + '</div>'
  ).join('');
}

/* ============================== column ============================== */
function renderColumn(key) {
  const st = state[key];
  const col = $('#col-' + key);
  const titleEl = $('.col-title', col);
  if (st.data && (st.data.studentName || st.data.className)) {
    titleEl.textContent = ((st.data.className || '') + ' ' + (st.data.studentName || '')).trim();
  } else {
    titleEl.textContent = 'Loading…';
  }
  updateSyncLabel(key);
  const note = $('.col-note', col);
  if (!st.configured) {
    note.hidden = false;
    note.textContent = 'File not configured yet — paste its Google Drive URL into FILE_' + key + '_URL at the top of this file.';
  } else if (st.error) {
    note.hidden = false;
    note.textContent = st.data ? 'Could not refresh — showing last updated data.' : 'Could not load data (' + st.error + ').';
  } else {
    note.hidden = true;
  }
  if (!st.data) {
    $('.nscroll', col).innerHTML = '<div class="hw-empty">Waiting for data…</div>';
    $('.calgrid', col).innerHTML = '';
    $('.cal-lines', col).innerHTML = '';
    $('.cal-title', col).textContent = '';
    $('.hw-body', col).innerHTML = '<div class="hw-empty">Waiting for data…</div>';
    return;
  }
  renderNotices(key, st.data);
  renderCal(key, st.data);
  renderHomework(key, st.data);
}
function updateSyncLabel(key) {
  const st = state[key];
  const el = document.querySelector('.col-sync[data-key="' + key + '"]');
  if (el) el.textContent = agoText(st.data && st.data.syncedAt);
}
function updateAllSyncLabels() { updateSyncLabel('A'); updateSyncLabel('B'); }

/* ============================== modal ============================== */
function openModal(title, url) {
  $('#modal-title').textContent = title || '';
  const body = $('#modal-body');
  body.innerHTML = '';
  const nt = $('#modal-newtab');
  if (url) {
    nt.style.display = '';
    nt.href = url;
    if (isImageUrl(url)) {
      const img = document.createElement('img');
      img.alt = title || 'attachment';
      img.onerror = () => {
        body.innerHTML = '<div class="mfallback">This attachment could not be shown here.<br>Try opening it in a new tab below.</div>';
      };
      img.src = url;
      body.appendChild(img);
    } else {
      const fr = document.createElement('iframe');
      fr.src = url;
      fr.title = title || 'attachment';
      body.appendChild(fr);
    }
  } else {
    nt.style.display = 'none';
  }
  $('#mback').hidden = false;
}
function closeModal() { $('#mback').hidden = true; $('#modal-body').innerHTML = ''; }

/* ============================== clock ============================== */
function tick() {
  const n = new Date();
  let h = n.getHours();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  const hh = String(h).padStart(2, '0');
  const mm = String(n.getMinutes()).padStart(2, '0');
  $('#clock').textContent = WD_LONG[n.getDay()] + ', ' + n.getDate() + ' ' + MO_LONG[n.getMonth()] + ' ' + n.getFullYear() + ' · ' + hh + ':' + mm + ' ' + ap;
}

/* ============================== events ============================== */
document.addEventListener('click', (e) => {
  // modal close
  if (e.target.id === 'mback' || e.target.closest('#modal-close')) { closeModal(); return; }
  // notice section chevron
  const sh = e.target.closest('[data-sechead]');
  if (sh) {
    const col = sh.closest('.col');
    const key = col.id === 'col-A' ? 'A' : 'B';
    const sec = sh.getAttribute('data-sechead');
    secOpen[key][sec] = !secOpen[key][sec];
    const st = state[key];
    if (st.data) renderNotices(key, st.data);
    return;
  }
  // notice attachment tap
  const row = e.target.closest('.nrow[data-url]');
  if (row) {
    openModal(row.getAttribute('data-title') || 'Attachment', row.getAttribute('data-url'));
    return;
  }
  // calendar month nav
  const nav = e.target.closest('[data-calnav]');
  if (nav) {
    const col = nav.closest('.col');
    const key = col.id === 'col-A' ? 'A' : 'B';
    const st = state[key];
    if (!calView[key]) { const n = new Date(); calView[key] = { y: n.getFullYear(), m: n.getMonth() }; }
    let { y, m } = calView[key];
    m += parseInt(nav.getAttribute('data-calnav'), 10);
    if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    calView[key] = { y, m };
    if (st.data) renderCal(key, st.data);
    return;
  }
  // calendar day tap
  const day = e.target.closest('.day[data-day]');
  if (day && day.classList.contains('has-ev')) {
    const col = day.closest('.col');
    const key = col.id === 'col-A' ? 'A' : 'B';
    const grid = $('.calgrid', col);
    showDayEvents(key, day.getAttribute('data-day'), grid._evMap || {});
    return;
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#mback').hidden) closeModal();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshAll();
});

/* ============================== init ============================== */
tick();
setInterval(tick, 1000);
setInterval(updateAllSyncLabels, 30000);
refreshAll();
if (REFRESH_MINUTES > 0) setInterval(refreshAll, REFRESH_MINUTES * 60000);
</script>
</body>
</html>
